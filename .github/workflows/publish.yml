name: Publish to npm

on:
  push:
    branches:
      - release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing over OIDC needs npm >= 11.5.1; node 20 ships npm 10.
      - run: npm install -g npm@latest

      - run: npm install

      - run: npm run build

      - run: npm test -- --run

      - run: npm publish --provenance --access public
